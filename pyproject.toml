[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "app-rotator"
version = "0.2.1"
description = "A configurable, fail-closed Windows tray rotator for resource-heavy desktop apps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lukas Geiger" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
  "Topic :: Utilities",
]
dependencies = [
  "Pillow>=10.0",
  "psutil>=5.9",
  "pystray>=0.19",
]

[project.urls]
Homepage = "https://github.com/dev-bricks/app-rotator"
Documentation = "https://github.com/dev-bricks/app-rotator#readme"
Repository = "https://github.com/dev-bricks/app-rotator"
Issues = "https://github.com/dev-bricks/app-rotator/issues"
Changelog = "https://github.com/dev-bricks/app-rotator/blob/master/CHANGELOG.md"
Security = "https://github.com/dev-bricks/app-rotator/blob/master/SECURITY.md"
Umbrella = "https://github.com/open-bricks"
"Parent Organization" = "https://github.com/dev-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
app-rotator = "app_rotator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app_rotator = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
