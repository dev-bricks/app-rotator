[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "app-rotator"
version = "0.2.3"
description = "A configurable, fail-closed Windows tray rotator for resource-heavy desktop apps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Lukas Geiger" }]
keywords = [
  "antigravity",
  "app-rotator",
  "claude-desktop",
  "codex",
  "desktop-app",
  "dev-bricks",
  "fail-closed",
  "gpu-management",
  "local-first",
  "open-bricks",
  "productivity",
  "system-tray",
  "time-slicing",
  "vram-management",
  "windows",
  "zero-egress",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]
dependencies = [
  "Pillow>=10.0",
  "psutil>=5.9",
  "pystray>=0.19",
]

[project.urls]
Homepage = "https://github.com/dev-bricks/app-rotator"
Documentation = "https://github.com/dev-bricks/app-rotator#readme"
Repository = "https://github.com/dev-bricks/app-rotator"
Issues = "https://github.com/dev-bricks/app-rotator/issues"
"Bug Tracker" = "https://github.com/dev-bricks/app-rotator/issues"
Changelog = "https://github.com/dev-bricks/app-rotator/blob/master/CHANGELOG.md"
Security = "https://github.com/dev-bricks/app-rotator/blob/master/SECURITY.md"
Umbrella = "https://github.com/open-bricks"
"Parent Organization" = "https://github.com/dev-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"Third-Party Licenses" = "https://github.com/dev-bricks/app-rotator/blob/master/THIRD_PARTY_LICENSES.md"
Notice = "https://github.com/dev-bricks/app-rotator/blob/master/NOTICE"
"Marketing" = "https://github.com/dev-bricks/app-rotator/blob/master/MARKETING-LOG.txt"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
app-rotator = "app_rotator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app_rotator = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v"
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [".git", ".pytest_cache", "__pycache__", "build", "dist", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
