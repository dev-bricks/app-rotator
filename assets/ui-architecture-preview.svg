        <text x="24" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">EN</text>
        <text x="54" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">PROVIDER NAME</text>
        <text x="220" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">RUNTIME</text>
        <text x="320" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">DELEGATION CONTROLLER</text>

        <!-- Provider Row 1: Codex -->
        <g transform="translate(12, 56)">
          <rect width="458" height="24" rx="4" fill="#132338" />
          <circle cx="12" cy="12" r="5" fill="#22c55e" />
          <text x="42" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Codex Desktop</text>
          <text x="208" y="16" fill="#38bdf8" font-family="monospace" font-size="11">60.0 min</text>
          <text x="308" y="16" fill="#94a3b8" font-family="monospace" font-size="10">safe-start-for-codex</text>
        </g>

        <!-- Provider Row 2: Claude -->
        <g transform="translate(12, 84)">
          <rect width="458" height="24" rx="4" fill="#0f172a" />
          <circle cx="12" cy="12" r="5" fill="#22c55e" />
          <text x="42" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Claude Desktop</text>
          <text x="208" y="16" fill="#38bdf8" font-family="monospace" font-size="11">60.0 min</text>
          <text x="308" y="16" fill="#64748b" font-family="monospace" font-size="10">— (None / Direct AppX)</text>
        </g>

        <!-- Provider Row 3: Antigravity -->
        <g transform="translate(12, 112)">
          <rect width="458" height="24" rx="4" fill="#0f172a" />
          <circle cx="12" cy="12" r="5" fill="#22c55e" />
          <text x="42" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Antigravity IDE</text>
          <text x="208" y="16" fill="#38bdf8" font-family="monospace" font-size="11">60.0 min</text>
          <text x="308" y="16" fill="#64748b" font-family="monospace" font-size="10">— (None / Direct Binary)</text>
        </g>
