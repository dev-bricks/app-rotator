    <g transform="translate(236, 36)">
      <rect width="130" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="65" y="19" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Inter-App Gap</text>
      <text x="65" y="33" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">VRAM -> 0GB Purge</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 374 57 L 392 57" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Phase 3: Claude -->
    <g transform="translate(398, 36)">
      <rect width="180" height="42" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
      <text x="90" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Claude Desktop</text>
      <text x="90" y="34" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Runtime (e.g. 60 min)</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 586 57 L 604 57" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Phase 4: Inter-App Gap -->
    <g transform="translate(610, 36)">
      <rect width="130" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="65" y="19" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Inter-App Gap</text>
      <text x="65" y="33" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">VRAM -> 0GB Purge</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 748 57 L 766 57" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Phase 5: Cycle Pause -->
    <g transform="translate(772, 36)">
      <rect width="124" height="42" rx="6" fill="#4338ca" fill-opacity="0.25" stroke="#818cf8" stroke-width="1" />
      <text x="62" y="19" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Cycle Pause</text>
      <text x="62" y="33" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Cooldown (15 min)</text>
