  <!-- Bottom Panel: Time-Slicing Progression Diagram -->
  <g transform="translate(40, 460)" filter="url(#shadow)">
    <rect width="920" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <text x="24" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">DETERMINISTIC ROTATION &amp; VRAM PURGE DYNAMICS</text>
    <text x="420" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Continuous Memory Reclamation Guarantee</text>

    <!-- Phase 1: Codex -->
