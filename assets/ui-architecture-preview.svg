      <text x="180" y="101" fill="#f8fafc" font-family="monospace" font-size="11" text-anchor="middle">240.0</text>
      <text x="218" y="100" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">min (Watchdog auto-stop; 0 = unlimited)</text>

