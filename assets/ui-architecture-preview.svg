      <text x="180" y="75" fill="#f8fafc" font-family="monospace" font-size="11" text-anchor="middle">15.0</text>
      <text x="218" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">min (Rest gap after full provider rotation)</text>

      <!-- Input Row 3 -->
