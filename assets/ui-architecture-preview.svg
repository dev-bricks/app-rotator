<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" rx="16" fill="url(#bgGrad)" />
  <rect width="998" height="578" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header Banner -->
  <g transform="translate(40, 32)">
    <rect width="44" height="44" rx="10" fill="url(#accentGrad)" />
    <path d="M 22 12 L 22 32 M 16 18 L 22 12 L 28 18 M 12 28 C 16 34 28 34 32 28" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="58" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">App Rotator — System Tray &amp; Native Settings Architecture</text>
    <text x="58" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">Fail-Closed Windows Desktop Time-Slicing &amp; VRAM Purge Controls</text>
    <rect x="760" y="8" width="160" height="28" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <text x="840" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">v0.2.3 • RunAsInvoker</text>
  </g>

  <!-- Left Card: System Tray Context Menu -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="360" height="340" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Card Header -->
    <rect width="360" height="40" rx="12" fill="#1e293b" />
    <rect width="360" height="12" y="28" fill="#1e293b" />
    <circle cx="24" cy="20" r="5" fill="#22c55e" />
    <text x="38" y="25" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">pystray System Tray Context Menu</text>
    
    <!-- Menu Items -->
    <g transform="translate(20, 56)">
      <!-- App Header -->
      <rect width="320" height="32" rx="6" fill="#0f172a" stroke="#1e293b" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="28" y="20" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">App Rotator (Running)</text>
      <text x="304" y="20" fill="#22c55e" font-family="monospace" font-size="11" text-anchor="end">Cycle #4</text>

      <!-- Active Status Box -->
      <g transform="translate(0, 42)">
        <rect width="320" height="66" rx="6" fill="#0369a1" fill-opacity="0.12" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" />
        <text x="14" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Active Provider :</text>
        <text x="110" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Codex Desktop (App 1/3)</text>
        
        <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Phase Countdown :</text>
        <text x="118" y="40" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">45m 20s remaining</text>
        
        <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Purge Action   :</text>
        <text x="118" y="56" fill="#fbbf24" font-family="monospace" font-size="10">Inter-App Gap in 45m</text>
      </g>

      <!-- Action Commands -->
