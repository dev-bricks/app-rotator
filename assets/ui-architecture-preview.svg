      <text x="218" y="48" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">min (All apps closed; VRAM &amp; RAM purge)</text>

      <!-- Input Row 2 -->
      <text x="16" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Cycle Pause Cooldown :</text>
