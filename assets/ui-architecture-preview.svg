        <text x="16" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">CONFIGURED PROVIDER ROTATION ROSTER</text>
        
        <!-- Table Header -->
