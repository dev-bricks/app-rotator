        <rect width="320" height="26" rx="4" fill="#1e293b" />
        <text x="14" y="17" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">▶  Play / Start Rotation (Active)</text>
        
        <rect y="30" width="320" height="26" rx="4" fill="#0f172a" />
        <text x="14" y="47" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">⏸  Pause Rotation (Immediate Safe Hold)</text>
        
        <rect y="60" width="320" height="26" rx="4" fill="#0f172a" />
        <text x="14" y="77" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">⏹  Stop / Aus (Close Active &amp; Reset Index)</text>

        <line x1="0" y1="94" x2="320" y2="94" stroke="#334155" stroke-width="1" />

        <rect y="102" width="320" height="26" rx="4" fill="#0f172a" />
        <text x="14" y="119" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">⚙  Settings &amp; Durations GUI...</text>

        <rect y="132" width="320" height="26" rx="4" fill="#0f172a" />
        <text x="14" y="149" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">📄  View Audit Log (events.jsonl)</text>
      </g>
    </g>
  </g>

  <!-- Right Card: Native Settings GUI -->
  <g transform="translate(430, 100)" filter="url(#shadow)">
    <rect width="530" height="340" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Window Bar -->
