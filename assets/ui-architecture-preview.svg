      <text x="90" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Codex Desktop</text>
      <text x="90" y="34" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Runtime (e.g. 60 min)</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 212 57 L 230 57" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arrow)" />

